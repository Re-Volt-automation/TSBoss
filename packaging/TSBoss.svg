<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2933"/>
      <stop offset="1" stop-color="#0b1015"/>
    </linearGradient>
    <radialGradient id="cone" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3d4b59"/>
      <stop offset="1" stop-color="#161d24"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- speaker driver -->
  <circle cx="128" cy="128" r="84" fill="none" stroke="#2b3744" stroke-width="6"/>
  <circle cx="128" cy="128" r="78" fill="url(#cone)"/>
  <circle cx="128" cy="128" r="30" fill="#0f1419"/>
  <circle cx="128" cy="128" r="30" fill="none" stroke="#4fd1c5" stroke-width="3"/>
  <!-- mounting holes -->
  <g fill="#4fd1c5">
    <circle cx="128" cy="56" r="7"/>
    <circle cx="200" cy="128" r="7"/>
    <circle cx="128" cy="200" r="7"/>
    <circle cx="56" cy="128" r="7"/>
  </g>
</svg>
